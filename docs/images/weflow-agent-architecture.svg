<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <!-- weflow-cli — Agent harness architecture (maintainable source).
       Edit this file to change structure/labels, then render to PNG with sharp (density 160). -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1b1b1b"/>
    </marker>
    <style>
      .box { fill:#fff8e8; stroke:#1b1b1b; stroke-width:2.5; rx:10; }
      .accent { fill:#e8603c; stroke:#1b1b1b; stroke-width:2; rx:8; }
      .warm { fill:#f2c14e; stroke:#1b1b1b; stroke-width:2; rx:8; }
      .kb { fill:#cfe8d8; stroke:#1b1b1b; stroke-width:2; rx:8; }
      .lbl { font-size:15px; fill:#1b1b1b; text-anchor:middle; }
      .small { font-size:11.5px; fill:#5a4b3c; text-anchor:middle; }
      .title { font-size:29px; font-weight:700; fill:#1b1b1b; text-anchor:middle; }
      .layer { font-size:13px; fill:#8a7358; text-anchor:start; font-weight:600; }
      .edge { stroke:#1b1b1b; stroke-width:2; marker-end:url(#arrow); fill:none; }
    </style>
  </defs>
  <rect width="1280" height="820" fill="#f6ecd7"/>
  <text x="640" y="48" class="title">weflow-cli Agent 架构</text>

  <text x="40" y="100" class="layer">入口</text>
  <text x="360" y="100" class="layer">守护进程 · ReAct 循环</text>
  <text x="700" y="100" class="layer">工具</text>
  <text x="1010" y="100" class="layer">数据 / 知识</text>

  <!-- 入口 -->
  <rect x="40" y="115" width="230" height="66" class="box"/>
  <text x="155" y="143" class="lbl">微信 Bot 通道 (iLink)</text>
  <text x="155" y="165" class="small">长轮询 · 白名单准入</text>
  <rect x="40" y="200" width="230" height="66" class="box"/>
  <text x="155" y="228" class="lbl">本机面板 / harness</text>
  <text x="155" y="250" class="small">单窗口 · 思考链可视</text>
  <rect x="40" y="285" width="230" height="66" class="box"/>
  <text x="155" y="313" class="lbl">MCP 客户端</text>
  <text x="155" y="335" class="small">受控子集 · confirm 门禁</text>

  <!-- ReAct 循环 -->
  <rect x="350" y="115" width="320" height="300" class="warm"/>
  <text x="510" y="146" class="lbl" font-weight="700">ReAct 循环（最多 6 轮）</text>
  <text x="510" y="170" class="small">三层记忆：工作窗口 / 滚动摘要 / 长期事实</text>
  <rect x="370" y="186" width="280" height="56" class="box"/>
  <text x="510" y="208" class="lbl">Jev 判断层（11 项 noul 多选）</text>
  <text x="510" y="228" class="small">建议工具 → tool_choice 精确指定强制调用</text>
  <rect x="370" y="254" width="280" height="52" class="box"/>
  <text x="510" y="274" class="lbl">工具分派 + 串行队列</text>
  <text x="510" y="293" class="small">并行 tool_calls 消息连续性</text>
  <rect x="370" y="318" width="280" height="52" class="box"/>
  <text x="510" y="338" class="lbl">记忆整理（每轮末）</text>
  <text x="510" y="357" class="small">原话压摘要留归档 / 每6轮抽事实</text>
  <rect x="370" y="382" width="280" height="24" class="box"/>
  <text x="510" y="398" class="small">守卫红线（默认最小化）</text>

  <!-- 工具组 -->
  <rect x="700" y="115" width="270" height="76" class="box"/>
  <text x="835" y="141" class="lbl">微信数据查询</text>
  <text x="835" y="162" class="small">会话 / 聊天 / 收藏 / 朋友圈</text>
  <text x="835" y="180" class="small">读书 / 日报 / 待办</text>
  <rect x="700" y="203" width="270" height="76" class="accent"/>
  <text x="835" y="229" class="lbl">联网 + 文件读取</text>
  <text x="835" y="250" class="small">web_search (Bing)</text>
  <text x="835" y="268" class="small">read_document / read_file</text>
  <rect x="700" y="291" width="270" height="84" class="kb"/>
  <text x="835" y="317" class="lbl">知识库检索</text>
  <text x="835" y="338" class="small">search_knowledge / get_concepts</text>
  <text x="835" y="356" class="small">概念页匹配 → 语义索引兜底</text>
  <rect x="700" y="387" width="270" height="76" class="box"/>
  <text x="835" y="413" class="lbl">三级文件权限</text>
  <text x="835" y="434" class="small">L0 安全范围 / L1 只读跨目录</text>
  <text x="835" y="452" class="small">L2 白名单写 (不开放)</text>

  <!-- 数据 / 知识层 -->
  <rect x="1000" y="115" width="245" height="62" class="box"/>
  <text x="1122" y="140" class="lbl">微信数据库</text>
  <text x="1122" y="160" class="small">只读 · immutable</text>
  <rect x="1000" y="189" width="245" height="62" class="box"/>
  <text x="1122" y="214" class="lbl">微信文件目录</text>
  <text x="1122" y="234" class="small">按文件名定位实体</text>
  <!-- 知识库大框 -->
  <rect x="1000" y="263" width="245" height="128" class="kb"/>
  <text x="1122" y="286" class="lbl" font-weight="700">知识库（本地）</text>
  <text x="1122" y="308" class="small">RAG 语义索引 · 向量+BM25 混合</text>
  <text x="1122" y="328" class="small">wiki 概念页 ~48k · 卡片 ~18k</text>
  <text x="1122" y="348" class="small">Sources 原文 · 文章/聊天两条线</text>
  <text x="1122" y="372" class="small">增量编译（article-notes → wiki）</text>
  <rect x="1000" y="403" width="245" height="62" class="box"/>
  <text x="1122" y="428" class="lbl">云端 LLM</text>
  <text x="1122" y="448" class="small">提问/答复出境 · 嵌入走中转</text>

  <!-- 连线：入口 → ReAct -->
  <path class="edge" d="M270,148 L350,175"/>
  <path class="edge" d="M270,233 L350,215"/>
  <path class="edge" d="M270,318 L350,265"/>
  <!-- ReAct → 工具 -->
  <path class="edge" d="M670,205 L700,150"/>
  <path class="edge" d="M670,245 L700,240"/>
  <path class="edge" d="M670,290 L700,330"/>
  <path class="edge" d="M670,370 L700,420"/>
  <!-- 工具 → 数据 -->
  <path class="edge" d="M970,150 L1000,145"/>
  <path class="edge" d="M970,240 L1000,220"/>
  <path class="edge" d="M970,330 L1000,320"/>
  <path class="edge" d="M970,420 L1000,430"/>

  <!-- 红线 -->
  <rect x="350" y="530" width="895" height="104" class="accent"/>
  <text x="797" y="560" class="lbl" font-weight="700">红线（独立于守卫总开关，永不关闭）</text>
  <text x="797" y="586" class="small">Jev 建议了必调工具 · 工具说"未找到"不许编具体事实 · 声称"已调用工具"零调用算编造</text>
  <text x="797" y="610" class="small">补问后仍编造给诚实弃权 · 提权工具不进 MCP · 隐私默认 open · 无预设备份防御</text>
  <text x="797" y="630" class="small">编辑本 SVG 改结构 → sharp 渲染 PNG（文字 100% 准确，不依赖文生图）</text>
</svg>
