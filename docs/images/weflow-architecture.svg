<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">WeFlow CLI architecture</title>
  <desc id="desc">Local-first layers from user inputs through CLI, MCP and services to data adapters and local outputs, with optional external services. The database is opened read-only.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .panel { stroke: #d7dce3; stroke-width: 2; rx: 14; }
      .title { font: 700 27px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .label { font: 600 22px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .body { font: 18px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 16px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tag { font: 700 16px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .arrow { stroke: #64748b; stroke-width: 3; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1600" height="1180"/>
  <text class="title" x="80" y="66">WeFlow CLI · 当前技术架构</text>
  <text class="small" x="80" y="96">本地优先：只有用户明确选择的文章抓取、微信读书、Bot 通道或云端 AI 才会联网</text>
  <text class="small" x="80" y="118">数据库一律只读打开：不在微信的库旁写入 -wal / -shm，也不改变客户端状态</text>

  <rect class="panel" x="80" y="140" width="1440" height="140" fill="#e9eef8"/>
  <rect x="105" y="161" width="112" height="34" rx="17" fill="#3767a8"/><text class="tag" x="130" y="185">入口</text>
  <text class="label" x="105" y="235">终端用户</text><text class="body" x="105" y="263">weflow-cli &lt;command&gt;</text>
  <text class="label" x="460" y="235">MCP 客户端</text><text class="body" x="460" y="263">stdio JSON-RPC</text>
  <text class="label" x="810" y="235">可选 Bot 通道</text><text class="body" x="810" y="263">官方会话与白名单</text>
  <text class="label" x="1190" y="235">维护 Agent</text><text class="body" x="1190" y="263">代码、测试与文档</text>

  <line class="arrow" x1="800" y1="280" x2="800" y2="315"/>
  <rect class="panel" x="80" y="325" width="1440" height="200" fill="#e7f4f0"/>
  <rect x="105" y="346" width="150" height="34" rx="17" fill="#16866f"/><text class="tag" x="130" y="370">CLI 与服务</text>
  <text class="body" x="105" y="412">初始化与配置（Windows 自动 · Linux 登录授权后自动）</text>
  <text class="body" x="105" y="448">sessions / contacts / messages · export · evidence</text>
  <text class="body" x="105" y="484">favorites · sns · report · todos · assistant</text>
  <text class="body" x="105" y="520">daily / daily-server · 定时任务与邮件 · vault / wiki / weread</text>
  <text class="body" x="880" y="412">路径与权限校验</text>
  <text class="body" x="880" y="448">隐私过滤 · 白名单 · 发送确认</text>
  <text class="body" x="880" y="484">日期、来源和 no-ai 开关</text>
  <text class="body" x="880" y="520">生成成本统计（token 数与决策模型费用）</text>

  <line class="arrow" x1="800" y1="525" x2="800" y2="560"/>
  <rect class="panel" x="80" y="570" width="1440" height="200" fill="#fff5df"/>
  <rect x="105" y="591" width="160" height="34" rx="17" fill="#c47b16"/><text class="tag" x="130" y="615">适配与工作流</text>
  <text class="body" x="105" y="657">Node：数据库适配 · 配置加密 · 消息通道 · MCP 工具</text>
  <text class="body" x="105" y="693">Python：NT 数据 · 公众号日报 · HTML 阅读器 · 搜索与报告</text>
  <text class="body" x="105" y="729">数据库只读打开：有 WAL 读副本，无 WAL 直接 immutable</text>
  <text class="body" x="105" y="765">分类：决策模型（Jev）判断主题与相关度，失败回退 LLM</text>
  <text class="body" x="880" y="657">只有「AI」「学术」两类进入 AI 解析</text>
  <text class="body" x="880" y="693">抓取前并发预热正文（默认 8 并发，可关闭）</text>
  <text class="body" x="880" y="729">无日期时先补齐昨天，再生成今天</text>
  <text class="body" x="880" y="765">来源类别优先于文章主题分类</text>

  <line class="arrow" x1="800" y1="770" x2="800" y2="805"/>
  <rect class="panel" x="80" y="815" width="680" height="190" fill="#edf1f5"/>
  <rect x="105" y="836" width="120" height="34" rx="17" fill="#536579"/><text class="tag" x="130" y="860">本地数据</text>
  <text class="body" x="105" y="900">微信 3.x / 4.x 数据库与媒体缓存（只读）</text>
  <text class="body" x="105" y="935">日报、阅读状态、收藏、Vault 与证据包</text>
  <text class="body" x="105" y="970">本机配置、加密密钥与助手记忆</text>

  <rect class="panel" x="840" y="815" width="680" height="190" fill="#f1eefa"/>
  <rect x="865" y="836" width="150" height="34" rx="17" fill="#7654a8"/><text class="tag" x="890" y="860">按需联网</text>
  <text class="body" x="865" y="900">公众号网页 · 微信读书 API · 官方 Bot</text>
  <text class="body" x="865" y="935">用户配置的云端 AI 与决策模型端点</text>
  <text class="body" x="865" y="970">默认不自动上传聊天数据库或证据包</text>

  <rect x="80" y="1030" width="1440" height="44" rx="22" fill="#14213d"/>
  <text class="tag" x="470" y="1058">隐私边界：仅处理本人或明确获授权的数据 · 阅读器默认仅监听 127.0.0.1</text>
</svg>
