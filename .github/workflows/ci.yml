name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # Node 与 Python 分开跑：以前合成一个 job，Node 侧一挂 Python 测试就完全
  # 不执行，Python 那边坏了几周也看不出来。
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 必须 >=22.13.0: src/core/sqlcipherCore.ts 顶层 import 'node:sqlite',
          # 该模块 22.5.0 才有、22.13.0 才不需要 --experimental-sqlite 标志。
          node-version: '22.13'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # The end-to-end acceptance suite builds a synthetic encrypted NT store,
      # which needs sqlcipher3. The prebuilt wheel avoids compiling OpenSSL
      # here. Marked non-fatal on purpose: if it cannot install, the suite
      # skips with a printed reason rather than failing the whole job on a
      # dependency it does not control.
      - run: python -m pip install --quiet sqlcipher3-binary
        continue-on-error: true
      - run: npm ci
      - run: npm run build
      # README 的命令面是**用户先发现漂移**的地方（1.5.0：照 README 敲 `init --path` 得到
      # `unknown option`）。这条要 cli.cjs + dist/，所以放在 build 之后；先跑判据自己的正对照，
      # 再扫真实的 README —— 判据失灵时必须报红，而不是安静地"全绿"。
      - name: README 命令面与 CLI 一致
        run: |
          python scripts/check_readme_commands.py --self-test
          python scripts/check_readme_commands.py
      - name: npm test
        # 失败时把挂了哪几条**发成 annotation**：日志本体存在 blob 存储上，本机那条路径
        # 时通时断（2026-10-11 实测：`gh run view --log-failed` 连试 12 次全超时，
        # 而 `gh run view --json` 一直能通）—— 结果就是"CI 红了 60 次、看不到红在哪"。
        # annotation 走的是 API，本机能读（`gh run view` 会把它们打出来）。
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/weflow-test.log || {
            echo "::error::npm test 失败——下面把失败的用例名发成 annotation（完整输出仍在本步日志里）"
            grep -E '^not ok [0-9]+ - |^# fail |^ℹ fail ' /tmp/weflow-test.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
          # 跳过 ≠ 通过：`ℹ skipped N` 只出现在日志里，而日志本机读不到 ⇒ 把"有东西没跑"发出来。
          # 用 warning（不失败）——依赖装不上时静默跳过是**有意**的选择，但覆盖率的缺口不能被藏起来。
          # 末尾的 `|| true` 不是装饰：这是脚本最后一条命令，而 `grep` 无命中退出 1，配合上面的
          # `set -o pipefail` 会让"一个跳过都没有"这个**最常见**的情况把整步弄红。
          grep -E '^ℹ skipped [1-9]|^# skip ' /tmp/weflow-test.log | head -20 | while IFS= read -r line; do
            echo "::warning::有测试没跑：$line"
          done || true

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # 装测试真正 import 的那些。这份清单曾经是 "zstandard + pycryptodome" 两个, 并写着
      # "requirements.txt 其余部分对这两个测试文件都不是必需的" —— 那句话随用例增长过期了:
      # `backfill_articles_test` / `bonds_test` 现在 import sqlcipher3, `knowledge_line_scope_test`
      # import numpy, 两者都在 requirements.txt 里。缺了它们不是"跳过"而是整批 collection error,
      # 所以这里必须装齐(用 sqlcipher3-binary: 预编译 wheel, 不必就地编 OpenSSL)。
      # cryptography 是 requirements.txt 里的运行时依赖，wechat_emoticon 的用例要在
      # **干净子进程**里 import 它；CI 漏装会让那条用例报红（2026-11-01 实测）。
      - run: python -m pip install --quiet zstandard pycryptodome numpy sqlcipher3-binary cryptography
      - name: python tests
        # 与 node job 同一套路：**失败**与**跳过**都发成 annotation（日志本机读不到，annotation 能读）。
        # 跳过尤其要发：这一层有两个静默缺口叠在一起 —— `sqlcipher3-binary` 的 install 标着
        # `continue-on-error`（有意，别因自己控制不了的依赖让 job 挂），而缺 `sqlcipher3` / `zstandard`
        # 的用例会 `skipTest` ⇒ 依赖装不上时那批覆盖**无声消失**，job 照样是绿的。发 warning，不失败。
        run: |
          set -o pipefail
          python -m unittest discover -s test -p '*_test.py' -v 2>&1 | tee /tmp/weflow-pytest.log || {
            echo "::error::python 测试失败——下面把失败的用例名发成 annotation"
            grep -E '^(FAIL|ERROR): ' /tmp/weflow-pytest.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
          grep -E "skipped '" /tmp/weflow-pytest.log | head -20 | while IFS= read -r line; do
            echo "::warning::有测试没跑（跳过）：$line"
          done || true

  # 发布前的一致性校验: 版本号、锁文件、npm 包内容
  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13'
      - name: 版本号与锁文件必须一致
        run: |
          pkg=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          echo "package.json=$pkg package-lock.json=$lock"
          test "$pkg" = "$lock" || { echo "::error::package-lock.json 版本与 package.json 不一致，请运行 npm install 重新生成"; exit 1; }
      - name: npm 包不得包含输出、模型、数据库或密钥
        run: |
          npm ci
          npm pack --dry-run 2>&1 | grep 'npm notice' > /tmp/pack.txt
          if grep -E 'output/|models/|node_modules|\.env|\.db$|\.dat$|_env\.json|secret|credential|\.key$|\.pem$' /tmp/pack.txt; then
            echo "::error::npm 包中包含敏感或体积过大的文件"; exit 1
          fi
          echo "包内容检查通过"

  # Linux 全局安装后的"写路径"回归：把包目录设成只读，模拟 /usr/lib/node_modules。
  #
  # 为什么单开一个 job：2026-11-01 在 Ubuntu 上实测，全局安装后 `weflow-cli daily`
  # 直接 PermissionError——输出根落在包目录里。CI 的 checkout 是**可写**的，
  # 所以在默认环境里这个 bug 永远不会红。这里的判据是"包目录不可写时还能不能跑"。
  linux-write-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet sqlcipher3-binary
      - run: npm ci
      - run: npm run build
      - name: 包目录只读时，输出根必须回退到 HOME
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$HOME/.weflow-cli"

          # 模拟全局安装：包目录属于 root，普通用户不可写
          chmod -R a-w dist scripts bin

          echo "--- TypeScript 侧 ---"
          out=$(node -e "import('./dist/src/utils/outputRoot.js').then(m => process.stdout.write(m.resolveOutputRoot()))")
          echo "resolveOutputRoot() = $out"
          case "$out" in
            "$HOME"/*) echo "  ✓ 落在 HOME 之下" ;;
            *) echo "::error::输出根没有回退到 HOME：$out"; exit 1 ;;
          esac

          echo "--- Python 侧 ---"
          py=$(python3 -c "import sys; sys.path.insert(0,'scripts'); import _utils; print(_utils.output_root())")
          echo "_utils.output_root() = $py"
          case "$py" in
            "$HOME"/*) echo "  ✓ 落在 HOME 之下" ;;
            *) echo "::error::Python 输出根没有回退到 HOME：$py"; exit 1 ;;
          esac

          # 反例：包目录可写时必须**保持原位置**（Windows 与源码检出的老用法不变）
          chmod -R u+w dist scripts bin
          out2=$(node -e "import('./dist/src/utils/outputRoot.js').then(m => process.stdout.write(m.resolveOutputRoot()))")
          echo "包目录可写时 resolveOutputRoot() = $out2"
          case "$out2" in
            "$HOME"/*) echo "::error::包目录可写时不应再回退到 HOME"; exit 1 ;;
            *) echo "  ✓ 仍在包目录（老路径不变）" ;;
          esac
      - name: 合成加密库 + CLI 端到端（Linux）
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$HOME/.weflow-cli"
          python3 - <<'PY'
          import hashlib, json, os, sqlcipher3
          home = os.environ['HOME']
          msg = os.path.join(home, 'synth', 'message')
          os.makedirs(msg, exist_ok=True)
          db = os.path.join(msg, 'message_0.db')
          # 合成密钥：只用于 CI，与任何真实账号无关
          key, salt = '11' * 32, '22' * 16
          gh = 'gh_citest00000000000000000000'
          conn = sqlcipher3.connect(db)
          conn.execute(f"PRAGMA key = \"x'{key}{salt}'\"")
          conn.execute('CREATE TABLE Name2Id (user_name TEXT)')
          conn.execute('INSERT INTO Name2Id VALUES (?)', (gh,))
          tbl = 'Msg_' + hashlib.md5(gh.encode()).hexdigest()
          conn.execute(f'CREATE TABLE "{tbl}" (create_time INTEGER, message_content BLOB)')
          xml = ('<msg><appmsg><title><![CDATA[CI 合成文章]]></title>'
                 '<url><![CDATA[https://mp.weixin.qq.com/s/CITEST000000000000000]]></url></appmsg></msg>')
          conn.execute(f'INSERT INTO "{tbl}" VALUES (?, ?)', (1793500000, xml.encode()))
          conn.commit()
          conn.close()
          json.dump({'ntDbPath': db, 'bizKey': key, 'bizSalt': salt},
                    open(os.path.join(home, '.weflow-cli', 'config.json'), 'w'),
                    ensure_ascii=False)
          print('合成库已就绪')
          PY
          echo "--- key-status（应报可解开 1 个库）---"
          python3 scripts/nt_decrypt.py key-status --root "$HOME/synth" --json | tee /tmp/ks.json
          python3 -c "import json;d=json.load(open('/tmp/ks.json'));assert d['matched']>=1, d;print('  ✓ 凭据可解开合成库')"

          echo "--- CLI daily（包目录只读）---"
          chmod -R a-w dist scripts bin
          node dist/bin/weflow-cli.js daily --date 2026-01-01 --dry-run --no-ai | tee /tmp/daily.log
          grep -q 'CI 合成文章' /tmp/daily.log || { echo "::error::没有读出合成文章"; exit 1; }
          echo "  ✓ Linux 端到端通过"
